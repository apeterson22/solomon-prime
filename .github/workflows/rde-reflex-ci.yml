name: RDE-Reflex CI

on:
  push:
    branches: ["main", "bootstrap/rde-reflex-v0.1"]
    paths:
      - "rde-reflex/**"
      - ".github/workflows/rde-reflex-ci.yml"
  pull_request:
    paths:
      - "rde-reflex/**"
      - ".github/workflows/rde-reflex-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rde-reflex
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: rde-reflex/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
