# ── Switching Policy ─────────────────────────────────────────────────
policy:
  # Try free cloud models first (zero cost, no local GPU needed)
  prefer_free_cloud: true
  
  # Fall back to local models if cloud is unavailable
  fallback_to_local: true
  
  # Switch after N consecutive errors from a model
  error_threshold: 3
  
  # Switch if response time exceeds N seconds
  timeout_threshold: 60
  
  # Reset model health scores daily at this hour (UTC)
  health_reset_hour: 4
  
  # Maximum tokens per request budget (to avoid large bills on paid APIs)
  max_tokens_per_request: 8192
  
  # Enable automatic model health checking
  health_check_enabled: true

# ── Task-to-Model Routing Hints ─────────────────────────────────────
routing:
  coding:
    preferred:
      - "ollama/qwen2.5-coder:7b"
      - "openrouter/deepseek/deepseek-chat-v3-0324:free"
      - "ollama/deepseek-r1:8b"
    fallback:
      - "openrouter/qwen/qwen3.5-4b:free"
      - "ollama/qwen3.5:4b"
  
  reasoning:
    preferred:
      - "openrouter/nvidia/nemotron-3-super-120b-a12b:free"
      - "ollama/deepseek-r1:8b"
      - "openrouter/moonshotai/kimi-k2.6:free"
    fallback:
      - "ollama/qwen3.5:4b"
      - "ollama/granite4.1:8b"
  
  general:
    preferred:
      - "openrouter/qwen/qwen3.5-4b:free"
      - "ollama/llama3.2:3b"
      - "openrouter/meta-llama/llama-3.2-3b-instruct:free"
    fallback:
      - "ollama/qwen3.5:4b"
      - "ollama/nemotron-3-nano:4b"
  
  fast:
    preferred:
      - "ollama/llama3.2:3b"
      - "openrouter/meta-llama/llama-3.2-3b-instruct:free"
      - "openrouter/mistralai/mistral-small-3.2-24b-instruct:free"
    fallback:
      - "ollama/qwen3.5:4b"
      - "openrouter/google/gemma-3n-e4b-it:free"
  
  summarization:
    preferred:
      - "openrouter/nvidia/nemotron-3-super-120b-a12b:free"
      - "openrouter/moonshotai/kimi-k2.6:free"
      - "openrouter/qwen/qwen3.5-4b:free"
    fallback:
      - "ollama/qwen3.5:4b"
      - "ollama/nemotron-3-nano:4b"
